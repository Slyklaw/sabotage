<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabotage</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b24;
    --border: #2a3345;
    --light-cell: #2c3648;
    --dark-cell: #1a2130;
    --p1: #f5c542;
    --p1-dark: #b8902a;
    --p2: #4fd8e8;
    --p2-dark: #2a9fb0;
    --text: #dfe6ee;
    --muted: #7f8ea3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  .app {
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    gap: 14px;
  }

  .topbar {
    width: min(96vw, calc(var(--cell) * 15 + 30px));
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .score-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 120px;
  }

  .score-card.p1 { border-left: 3px solid var(--p1); }
  .score-card.p2 { border-right: 3px solid var(--p2); }

  .dot { width: 14px; height: 14px; border-radius: 50%; }
  .dot.p1 { background: var(--p1); box-shadow: 0 0 8px rgba(245,197,66,.5); }
  .dot.p2 { background: var(--p2); box-shadow: 0 0 8px rgba(79,216,232,.5); }

  .score-card .name { font-weight: 600; letter-spacing: .4px; }
  .score-card .val {
    margin-left: auto;
    font-size: 1.2rem;
    font-weight: 700;
    color: #fff;
    min-width: 2ch;
    text-align: center;
  }

  .turn-pill {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 16px;
    font-weight: 700;
    letter-spacing: .5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .turn-pill .dot { width: 12px; height: 12px; }

  .board-wrap {
    position: relative;
    --cell: min(46px, calc((100vw - 30px) / 15), calc((100vh - 170px) / 7));
    width: calc(var(--cell) * 15);
    height: calc(var(--cell) * 7);
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,.5);
    display: grid;
    grid-template-columns: repeat(15, var(--cell));
    grid-template-rows: repeat(7, var(--cell));
    overflow: hidden;
  }

  .cell {
    width: var(--cell);
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: background-color .12s ease, box-shadow .12s ease;
  }

  .light { background: var(--light-cell); }
  .dark  { background: var(--dark-cell); }

  .cell:hover { filter: brightness(1.15); }

  .home-p1 { background: color-mix(in srgb, var(--p1) 30%, var(--light-cell)); border: 2px solid var(--p1-dark); }
  .home-p2 { background: color-mix(in srgb, var(--p2) 30%, var(--dark-cell));  border: 2px solid var(--p2-dark); }

  .cell.selected { outline: 3px dashed #fff; outline-offset: -1px; filter: brightness(1.25); }
  .cell.dest     { background-color: rgba(79,216,232,.28) !important; box-shadow: inset 0 0 0 2px var(--p2); }

  .piece {
    width: calc(var(--cell) * .74);
    height: calc(var(--cell) * .74);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 2px 6px rgba(0,0,0,.5), inset 0 -3px 4px rgba(0,0,0,.3);
    transition: transform .1s ease;
  }

  .piece.p1 { background: radial-gradient(circle at 35% 30%, #ffe28a, var(--p1) 60%, var(--p1-dark)); border: 2px solid var(--p1-dark); }
  .piece.p2 { background: radial-gradient(circle at 35% 30%, #b7f4fb, var(--p2) 60%, var(--p2-dark)); border: 2px solid var(--p2-dark); }

  .crown-mark {
    position: absolute;
    top: -10%;
    left: 50%;
    transform: translateX(-50%);
    font-size: calc(var(--cell) * .42);
    line-height: 1;
    color: #fff8d6;
    text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 6px rgba(255,215,0,.7);
    animation: bob 1.4s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(-2px); }
  }

  .footer {
    display: flex;
    align-items: center;
    gap: 16px;
    width: min(96vw, calc(var(--cell) * 15 + 30px));
  }

  .hint {
    color: var(--muted);
    font-size: .82rem;
    line-height: 1.4;
    flex: 1;
  }

  .btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 18px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .btn:hover { background: #232c3a; transform: translateY(-1px); }

  .banner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(8,12,18,.94);
    backdrop-filter: blur(3px);
    z-index: 50;
    animation: pop .25s ease-out;
  }

  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .banner-card {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 28px 40px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.7);
  }

  .banner-card h2 { font-size: 2rem; margin-bottom: 8px; letter-spacing: 1px; }
  .banner-card h2.p1 { color: var(--p1); }
  .banner-card h2.p2 { color: var(--p2); }

  .banner-card p { color: var(--muted); margin-bottom: 20px; font-size: .95rem; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar">
    <div class="score-card p1">
      <span class="dot p1"></span>
      <span class="name">Player 1</span>
      <span class="val" id="p1-score">4</span>
    </div>

    <div class="turn-pill" id="turn-pill">
      <span class="dot p1" id="turn-dot"></span>
      <span id="turn-text">Player 1's turn</span>
    </div>

    <div class="score-card p2">
      <span class="name">Player 2</span>
      <span class="val" id="p2-score">4</span>
      <span class="dot p2"></span>
    </div>
  </div>

  <div class="board-wrap" id="board"></div>

  <div class="footer">
    <div class="hint">
      Select a piece, then click a highlighted square to move. Move distance equals the number of pieces in that column (Crown not counted). Capture the Crown and return it Home — or eliminate all opponent pieces — to win.
    </div>
    <button class="btn" id="restart-btn">Restart</button>
  </div>

  <div class="banner hidden" id="banner">
    <div class="banner-card">
      <h2 id="winner-title"></h2>
      <p id="winner-sub"></p>
      <button class="btn" id="restart-btn-2">Play Again</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const COLS = 15;
  const ROWS = 7;
  const CENTER = [7, 3];
  const HOME_P1 = [3, 3];
  const HOME_P2 = [11, 3];

  const DIRS = [[0, -1], [0, 1], [-1, 0], [1, 0]]; // N, S, W, E

  let board;
  let current;
  let selected;
  let legalMoves;
  let gameOver = false;

  function inBounds(c, r) { return c >= 0 && c < COLS && r >= 0 && r < ROWS; }

  function createBoard() {
    const b = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    // Player 1 (N,S,W,E of Home)
    b[HOME_P1[1] - 1][HOME_P1[0]] = "p1";
    b[HOME_P1[1] + 1][HOME_P1[0]] = "p1";
    b[HOME_P1[1]][HOME_P1[0] - 1] = "p1";
    b[HOME_P1[1]][HOME_P1[0] + 1] = "p1";
    // Player 2
    b[HOME_P2[1] - 1][HOME_P2[0]] = "p2";
    b[HOME_P2[1] + 1][HOME_P2[0]] = "p2";
    b[HOME_P2[1]][HOME_P2[0] - 1] = "p2";
    b[HOME_P2[1]][HOME_P2[0] + 1] = "p2";
    // Crown
    b[CENTER[1]][CENTER[0]] = "crown";
    return b;
  }

  function countPiecesInColumn(c) {
    let n = 0;
    for (let r = 0; r < ROWS; r++) {
      const s = board[r][c];
      if (s === "p1" || s === "p2") n++;
    }
    return n;
  }

  function computeLegalMoves(c, r) {
    const moves = [];
    const N = countPiecesInColumn(c);
    for (const [dc, dr] of DIRS) {
      const nc = c + dc * N;
      const nr = r + dr * N;
      if (!inBounds(nc, nr)) continue;
      const dest = board[nr][nc];
      if ((dest === "p1" && current === 1) || (dest === "p2" && current === 2)) continue;
      moves.push({ col: nc, row: nr });
    }
    return moves;
  }

  function isHomeFor(c, r, player) {
    const h = player === 1 ? HOME_P1 : HOME_P2;
    return c === h[0] && r === h[1];
  }

  function countAllPieces() {
    let p1 = 0, p2 = 0;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const s = board[r][c];
        if (s === "p1") p1++;
        else if (s === "p2") p2++;
      }
    }
    return { p1, p2 };
  }

  function updateScores() {
    const { p1, p2 } = countAllPieces();
    document.getElementById("p1-score").textContent = p1;
    document.getElementById("p2-score").textContent = p2;
  }

  function updateTurn() {
    const dot = document.getElementById("turn-dot");
    const text = document.getElementById("turn-text");
    if (current === 1) {
      dot.className = "dot p1";
      text.textContent = "Player 1's turn";
    } else {
      dot.className = "dot p2";
      text.textContent = "Player 2's turn";
    }
  }

  function render() {
    const boardEl = document.getElementById("board");
    boardEl.innerHTML = "";

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.classList.add((c + r) % 2 === 0 ? "light" : "dark");

        if (isHomeFor(c, r, 1)) cell.classList.add("home-p1");
        else if (isHomeFor(c, r, 2)) cell.classList.add("home-p2");

        const s = board[r][c];

        if (s === "p1" || s === "p2") {
          const pieceEl = document.createElement("div");
          pieceEl.className = "piece " + s;
          // Crown possession indicator: current player holds crown (center is empty)
          if (s === current && board[CENTER[1]][CENTER[0]] === null) {
            const mark = document.createElement("span");
            mark.className = "crown-mark";
            mark.textContent = "♛";
            pieceEl.appendChild(mark);
          }
          cell.appendChild(pieceEl);
        } else if (s === "crown") {
          const mark = document.createElement("span");
          mark.className = "crown-mark";
          mark.textContent = "♛";
          cell.appendChild(mark);
        }

        if (selected && selected.col === c && selected.row === r) {
          cell.classList.add("selected");
        } else if (legalMoves.some(m => m.col === c && m.row === r)) {
          cell.classList.add("dest");
        }

        cell.dataset.col = c;
        cell.dataset.row = r;
        boardEl.appendChild(cell);
      }
    }
  }

  function selectPiece(c, r) {
    const s = board[r][c];
    if (s !== current) return; // only your own pieces
    selected = { col: c, row: r };
    legalMoves = computeLegalMoves(c, r);
    render();
  }

  function deselect() {
    selected = null;
    legalMoves = [];
    render();
  }

  function makeMove(dest) {
    if (!selected || !legalMoves.some(m => m.col === dest.col && m.row === dest.row)) return;

    const fromC = selected.col, fromR = selected.row;
    const toC = dest.col, toR = dest.row;

    // Capture destination state BEFORE overwriting
    const destBefore = board[toR][toC];

    // Move piece
    board[toR][toC] = current === 1 ? "p1" : "p2";
    board[fromR][fromC] = null;

    deselect();
    updateScores();

    let winner = null;
    const { p1, p2 } = countAllPieces();

    // Condition 2: eliminate all opponent pieces
    if (current === 1 && p2 === 0) winner = 1;
    else if (current === 2 && p1 === 0) winner = 2;

    // Condition 1: captured Crown and returned it Home
    if (!winner && isHomeFor(toC, toR, current)) {
      const wasCenter = (toC === CENTER[0] && toR === CENTER[1]);
      if (wasCenter) winner = current;
    }

    if (winner) {
      gameOver = true;
      showWinner(winner);
    } else {
      current = current === 1 ? 2 : 1;
      updateTurn();
    }

    render();
  }

  function showWinner(player) {
    const banner = document.getElementById("banner");
    const title = document.getElementById("winner-title");
    const sub = document.getElementById("winner-sub");
    title.className = "p" + player;
    title.textContent = "Player " + player + " Wins!";

    const { p1, p2 } = countAllPieces();
    let reason;
    if (player === 1 && p2 === 0) reason = "All of Player 2's pieces have been eliminated.";
    else if (player === 2 && p1 === 0) reason = "All of Player 1's pieces have been eliminated.";
    else reason = "The Crown has been captured and returned Home.";

    sub.textContent = reason;
    banner.classList.remove("hidden");
  }

  function restart() {
    board = createBoard();
    current = 1;
    selected = null;
    legalMoves = [];
    gameOver = false;
    document.getElementById("banner").classList.add("hidden");
    updateScores();
    updateTurn();
    render();
  }

  const boardEl = document.getElementById("board");

  boardEl.addEventListener("click", (e) => {
    if (gameOver) return;
    const cell = e.target.closest(".cell");
    if (!cell) return;
    const c = parseInt(cell.dataset.col);
    const r = parseInt(cell.dataset.row);

    // If a piece is selected and this is a legal destination, make the move
    if (selected && legalMoves.some(m => m.col === c && m.row === r)) {
      makeMove({ col: c, row: r });
      return;
    }

    // Otherwise try to select a piece
    const s = board[r][c];
    if (s === current) {
      selectPiece(c, r);
    } else {
      deselect();
    }
  });

  document.getElementById("restart-btn").addEventListener("click", restart);
  document.getElementById("restart-btn-2").addEventListener("click", restart);

  board = createBoard();
  current = 1;
  selected = null;
  legalMoves = [];
  updateScores();
  updateTurn();
  render();
})();
</script>
</body>
</html>
